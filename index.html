<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinEase — Your Daily Essentials, All in One Place</title>
    <meta
      name="description"
      content="FinEase — Hyperlocal grocery and household essentials delivery across Dehradun, Uttarakhand. Fresh produce, dairy, pantry staples, and daily essentials delivered to your doorstep."
    />
    <meta property="og:title" content="FinEase — Your Daily Essentials, All in One Place" />
    <meta
      property="og:description"
      content="Hyperlocal grocery and household essentials delivery in Dehradun, Uttarakhand."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('finease-theme') || 'system';
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved === 'dark' || (saved === 'system' && prefersDark);
          if (isDark) document.documentElement.classList.add('dark');
          else document.documentElement.classList.remove('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[var(--bg-canvas)] text-[var(--text-primary)] antialiased selection:bg-emerald-700/15 selection:text-emerald-900 dark:selection:bg-emerald-400/20 dark:selection:text-emerald-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
